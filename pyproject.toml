[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drone-fly"
version = "0.1.0"
description = "A measured fly circuit navigating a MuJoCo quadcopter"
requires-python = ">=3.11,<3.14"
dependencies = ["mujoco>=3.3,<4", "numpy>=2,<3", "pillow>=11", "fastapi>=0.115", "uvicorn[standard]>=0.34", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11"]

[project.scripts]
drone-fly = "drone_fly.server:main"

[tool.hatch.build.targets.wheel]
packages = ["drone_fly"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

